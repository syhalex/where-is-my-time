<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8f5">
  <meta name="description" content="WhereIsMyTime，记录每天的时间去向。">
  <title>WhereIsMyTime</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div id="storageNotice" class="storage-notice" role="alert" hidden><span id="storageNoticeText"></span><div><button type="button" id="storageExport" class="button quiet small">导出原件</button><button type="button" id="storageRestore" class="button primary small">找回记录</button></div></div>
    <section class="overview-section" aria-labelledby="overviewHeading">
      <div class="section-heading overview-heading"><h1 id="overviewHeading">时间总览</h1><div class="overview-controls"><div class="view-switch" role="tablist" aria-label="总览视图"><button role="tab" data-view="year">年</button><button role="tab" data-view="month">月</button><button role="tab" data-view="week">周</button><button role="tab" data-view="day">日</button></div><nav class="header-actions" aria-label="工具"><button class="button quiet" id="manageEvents"></button><div class="menu-wrap"><button class="button quiet" id="backupButton" aria-expanded="false" aria-controls="backupMenu"></button><div class="dropdown" id="backupMenu" hidden><button id="exportButton">导出备份</button><button id="importButton">导入备份</button></div></div></nav></div></div>
      <div class="overview-card">
        <div class="overview-toolbar"><div class="period-picker"><button class="icon-button" id="periodPrev" aria-label="上一时段"></button><h2 id="periodTitle"></h2><button class="icon-button" id="periodNext" aria-label="下一时段"></button><button class="button small quiet today-button" id="periodToday">今天</button></div><div class="overview-display-controls"><div id="aggregationSwitch" class="aggregation-switch" role="group" aria-label="时间支出展示方式"><button data-aggregation="events" aria-pressed="true">按事件</button><button data-aggregation="categories" aria-pressed="false">按分类</button></div><button class="filter-button" id="filterButton" aria-label="筛选事件"></button></div></div>
        <div class="stats" id="stats"></div>
        <div id="overview" class="overview-body"></div>
        <div class="overview-footer"><div class="legend" id="legend"></div><span class="period-total" id="periodTotal"></span></div>
      </div>
    </section>
    <section class="record-section" aria-labelledby="recordHeading">
      <div class="section-heading record-heading"><div class="record-title"><h2 id="recordHeading">记录一天</h2><div class="date-control"><button class="icon-button" id="dayPrev" aria-label="前一天"></button><button class="date-trigger" id="dateTrigger" aria-haspopup="dialog" aria-controls="dateDropdown" aria-expanded="false"><span id="selectedDateLabel"></span><span id="dateChevron"></span></button><input type="hidden" id="selectedDate"><button class="icon-button" id="dayNext" aria-label="后一天"></button></div></div><button class="button primary" id="addEntry"></button></div>
      <div class="record-layout"><div class="timeline-card" id="timelineCard"><div class="day-summary"><div class="day-title-group"><div class="day-summary-title" id="dayHeading"></div><button class="continue-button" id="continueEntry" hidden></button></div><div class="timeline-actions"><button type="button" id="timelineDownloadButton" class="icon-button timeline-download-button" aria-label="导出完整时间带图片" title="下载图片"></button><button type="button" id="timelineFullscreenButton" class="icon-button timeline-fullscreen-button" aria-label="全屏展示时间带" aria-haspopup="dialog" aria-controls="timelineFullscreenDialog" aria-expanded="false" title="全屏展示"></button></div></div><div id="timeBands" class="timeline-bands"></div><div class="timeline-legend" id="dayLegend"></div></div><aside class="daily-card"><div class="aside-heading"><h3>当天记录</h3><span class="count-badge" id="entryCount">0</span></div><div id="entryList"></div><div class="day-distribution" id="dayDistribution"></div></aside></div>
    </section>
  </main>
  <dialog id="timelineFullscreenDialog" class="timeline-fullscreen-dialog" aria-label="全天时间带"></dialog>
  <dialog id="timelineExportDialog" class="timeline-export-dialog" aria-labelledby="timelineExportTitle"><form id="timelineExportForm">
    <div class="dialog-heading"><h2 id="timelineExportTitle">导出图片</h2><button type="button" class="icon-button" data-close="timelineExportDialog" aria-label="关闭"></button></div>
    <div class="export-workspace">
      <div class="export-preview-panel" aria-label="图片预览"><img id="timelineExportPreview" alt="导出图片预览" hidden><div id="timelineExportStatus" class="export-preview-status" role="status">正在生成预览…</div></div>
      <aside class="export-options-panel" aria-label="选择图片模块">
        <div class="export-widget-choices">
          <div class="export-widget-option"><div class="export-widget-heading"><label for="exportDistributionModule">全天分布</label><input id="exportDistributionModule" type="checkbox" name="modules" value="distribution"></div><div class="export-widget-content" data-export-widget="distribution" aria-hidden="true" inert></div></div>
          <div class="export-widget-option"><div class="export-widget-heading"><label for="exportTimelineModule">全天记录</label><input id="exportTimelineModule" type="checkbox" name="modules" value="timeline" checked></div><div class="export-widget-content" data-export-widget="timeline" aria-hidden="true" inert></div></div>
          <div class="export-widget-option"><div class="export-widget-heading"><label for="exportEntriesModule">记录事件</label><input id="exportEntriesModule" type="checkbox" name="modules" value="entries"></div><div class="export-widget-content" data-export-widget="entries" aria-hidden="true" inert></div></div>
          <div class="export-widget-option"><div class="export-widget-heading"><label for="exportYearModule">当前年视图</label><input id="exportYearModule" type="checkbox" name="modules" value="year"></div><div class="export-widget-content" data-export-widget="year"></div></div>
          <div class="export-widget-option"><div class="export-widget-heading"><label id="exportViewLabel" for="exportOverviewModule">当前视图</label><input id="exportOverviewModule" type="checkbox" name="modules" value="overview"></div><div class="export-widget-content" data-export-widget="overview" aria-hidden="true" inert></div></div>
          <div class="export-widget-option"><div class="export-widget-heading"><div class="export-stat-heading"><button id="exportCategoriesRange" type="button" class="export-range-trigger" data-export-range="categories" aria-label="分类占比统计范围" aria-haspopup="listbox" aria-expanded="false"></button><label for="exportCategoriesModule">分类占比</label></div><input id="exportCategoriesModule" type="checkbox" name="modules" value="categories"></div><div class="export-widget-content" data-export-widget="categories" aria-hidden="true" inert></div></div>
          <div class="export-widget-option"><div class="export-widget-heading"><div class="export-stat-heading"><button id="exportFocusRange" type="button" class="export-range-trigger" data-export-range="focus" aria-label="关注分类统计范围" aria-haspopup="listbox" aria-expanded="false"></button><label for="exportFocusModule">关注分类</label></div><input id="exportFocusModule" type="checkbox" name="modules" value="focus"></div><div class="export-widget-content" data-export-widget="focus"></div></div>
          <div class="export-widget-option"><div class="export-widget-heading"><div class="export-stat-heading"><button id="exportDaysRange" type="button" class="export-range-trigger" data-export-range="days" aria-label="记录天数统计范围" aria-haspopup="listbox" aria-expanded="false"></button><label for="exportDaysModule">记录天数</label></div><input id="exportDaysModule" type="checkbox" name="modules" value="days"></div><div class="export-widget-content" data-export-widget="days" aria-hidden="true" inert></div></div>
        </div>
      </aside>
    </div>
    <div class="dialog-actions"><button type="button" class="button quiet" data-close="timelineExportDialog">取消</button><button type="submit" id="timelineExportConfirm" class="button primary">导出 PNG</button></div>
  </form></dialog>
  <dialog id="entryDialog" class="entry-dialog"><form id="entryForm" novalidate>
    <div class="dialog-heading"><h2 id="entryDialogTitle">记录时间</h2><button type="button" class="icon-button" data-close="entryDialog" aria-label="关闭"></button></div>
    <div class="modal-date-row"><div class="modal-date" id="modalDate"></div><span class="continuation-badge" id="continuationBadge" hidden>接续上一条</span></div>
    <div class="time-inputs"><label>开始<span class="time-field"><input id="startTime" type="text" inputmode="numeric" autocomplete="off" maxlength="5" required aria-label="开始时间"><span class="time-steppers"><button type="button" data-step-time="startTime" data-step="5" aria-label="开始时间增加5分钟"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 9.5 3-3 3 3"/></svg></button><button type="button" data-step-time="startTime" data-step="-5" aria-label="开始时间减少5分钟"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6.5 3 3 3-3"/></svg></button></span></span></label><span class="time-arrow" aria-hidden="true">→</span><label>结束<span class="time-field"><input id="endTime" type="text" inputmode="numeric" autocomplete="off" maxlength="5" required aria-label="结束时间"><span class="time-steppers"><button type="button" data-step-time="endTime" data-step="5" aria-label="结束时间增加5分钟"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 9.5 3-3 3 3"/></svg></button><button type="button" data-step-time="endTime" data-step="-5" aria-label="结束时间减少5分钟"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6.5 3 3 3-3"/></svg></button></span></span></label><output id="durationOutput"></output></div>
    <label class="field-label" for="entryName">做了什么</label><input id="entryName" class="name-input" type="text" maxlength="80" autocomplete="off" required>
    <div id="entryEventChoices" class="entry-event-choices" role="group" aria-label="选择已有事件" hidden></div>
    <div class="entry-category-heading"><span class="field-label">分类</span><button type="button" id="entryNewCategory" class="inline-button">新建分类</button></div>
    <div id="entryCategoryChoices" class="entry-category-choices" role="group" aria-label="选择事件分类"></div>
    <div class="color-heading"><span class="field-label">事件颜色</span><div class="palette-actions"><button type="button" class="inline-button" data-random-color="entry">随机颜色</button><button type="button" class="inline-button" data-refresh-colors="entry">换一组</button></div></div><div class="color-choices" id="colorChoices"></div>
    <p class="form-error" id="entryError" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" id="deleteEntry" class="button danger quiet">删除记录</button><span class="spacer"></span><button type="button" class="button quiet" data-close="entryDialog">取消</button><button type="submit" class="button primary">保存记录</button></div>
  </form></dialog>
  <dialog id="eventsDialog" class="wide-dialog"><div class="dialog-heading"><h2>时间与分类</h2><button class="icon-button" data-close="eventsDialog" aria-label="关闭"></button></div><div class="manager-tabs" role="tablist" aria-label="管理事件与分类"><button role="tab" data-manager-tab="events" aria-selected="true">事件</button><button role="tab" data-manager-tab="categories" aria-selected="false">分类</button></div><div id="eventManager"></div><div id="categoryManager" hidden></div></dialog>
  <div id="categoryDropdown" class="select-dropdown" popover="auto"><div id="categoryPickerChoices" role="listbox" aria-label="选择分类"></div><button class="button quiet category-new-button" id="pickerNewCategory">新建分类</button></div>
  <dialog id="categoryFormDialog" class="category-form-dialog"><form id="categoryForm"><div class="dialog-heading"><h2>新建分类</h2><button type="button" class="icon-button" data-close="categoryFormDialog" aria-label="关闭"></button></div><label class="field-label" for="categoryName">分类名称</label><input class="name-input" id="categoryName" maxlength="30" autocomplete="off" placeholder="例如 工作"><div class="color-heading category-color-label"><span class="field-label">分类颜色</span><div class="palette-actions"><button type="button" class="inline-button" data-random-color="categoryForm">随机颜色</button><button type="button" class="inline-button" data-refresh-colors="categoryForm">换一组</button></div></div><div class="color-choices" id="categoryFormColors"></div><p class="form-error" id="categoryError" role="alert" hidden></p><div class="dialog-actions"><button type="button" class="button quiet" data-close="categoryFormDialog">取消</button><button type="submit" class="button primary">创建分类</button></div></form></dialog>
  <div id="colorDropdown" class="color-dropdown select-dropdown" popover="auto"><form id="colorForm"><div class="dialog-heading"><h2>选择颜色</h2><button type="button" class="icon-button" data-dismiss-popover="colorDropdown" aria-label="关闭"></button></div><div class="color-plane" id="colorPlane" role="slider" tabindex="0" aria-label="颜色明度与饱和度" aria-valuemin="0" aria-valuemax="100"><span id="colorThumb"></span></div><input id="hueSlider" class="hue-slider" type="range" min="0" max="359" value="0" aria-label="色相"><div id="customPalette" class="custom-palette"></div><label class="hex-field"><span id="hexPreview" class="hex-preview"></span><input id="hexColor" aria-label="十六进制颜色" maxlength="7" autocomplete="off" spellcheck="false"></label><p class="form-error" id="colorError" role="alert" hidden></p><div class="dialog-actions"><button type="button" class="button quiet" data-dismiss-popover="colorDropdown">取消</button><button type="submit" class="button primary">使用颜色</button></div></form></div>
  <div id="dateDropdown" class="date-dropdown select-dropdown" popover="auto" aria-label="选择记录日期"><div class="date-picker-heading"><button type="button" id="pickerTitle" class="picker-title" aria-expanded="false"></button><div class="picker-nav"><button type="button" class="icon-button" id="pickerPrev" aria-label="上个月"></button><button type="button" class="icon-button" id="pickerNext" aria-label="下个月"></button></div></div><div id="pickerMonthPanel" hidden><div class="picker-year-control"><button class="icon-button" id="pickerYearPrev" aria-label="上一年"></button><input id="pickerYear" inputmode="numeric" aria-label="年份" maxlength="4"><button class="icon-button" id="pickerYearNext" aria-label="下一年"></button></div><div class="picker-months" id="pickerMonths"></div></div><div id="pickerCalendar"><div class="picker-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="picker-days" id="pickerDays"></div></div><div class="picker-footer"><button class="button quiet small" data-dismiss-popover="dateDropdown">取消</button><button class="button primary small" id="pickerToday">今天</button></div></div>
  <div id="categoryEventsDropdown" class="select-dropdown category-events-dropdown" popover="auto" role="dialog" aria-modal="false" aria-label="分类中的事件"><div class="usage-heading"><h3 id="categoryEventsTitle"></h3><button type="button" id="categoryEventsClose" class="icon-button" data-dismiss-popover="categoryEventsDropdown" aria-label="关闭"></button></div><div id="categoryEventList" class="usage-list" role="list"></div></div>
  <div id="focusDropdown" class="select-dropdown" popover="auto"><div id="focusCategoryChoices" role="listbox" aria-label="关注分类"></div></div><div id="filterDropdown" class="select-dropdown" popover="auto"><div id="filterChoices" role="listbox" aria-label="筛选事件"></div></div>
  <dialog id="importDialog" class="wide-dialog"><div class="dialog-heading"><h2>导入备份</h2><button class="icon-button" data-close="importDialog" aria-label="关闭"></button></div><div id="importSummary" class="import-summary"></div><div class="import-options"><label><input type="radio" name="importMode" value="merge" checked>合并到现有记录</label><label><input type="radio" name="importMode" value="replace">替换全部记录</label></div><p class="form-error" id="importError" role="alert" hidden></p><div class="dialog-actions"><button class="button quiet" data-close="importDialog">取消</button><button class="button primary" id="confirmImport">确认导入</button></div></dialog>
  <dialog id="confirmDialog" class="wide-dialog"><div class="dialog-heading"><h2 id="confirmTitle"></h2></div><div class="dialog-actions"><button class="button quiet" id="confirmCancel">取消</button><button class="button danger-solid" id="confirmAccept">删除</button></div></dialog>
  <div id="exportRangeDropdown" class="select-dropdown export-range-dropdown" popover="auto"><div id="exportRangeChoices" role="listbox" aria-label="统计范围"></div></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
